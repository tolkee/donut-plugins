name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24.21.0-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/verify-kit.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-pr.ts --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permissions-comment
          path: |
            comment.md
            pr-number.txt
          if-no-files-found: ignore
          retention-days: 7
