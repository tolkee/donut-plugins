name: ci-comment

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: permissions-comment
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Upsert the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [ -f artifact/comment.md ] && [ -f artifact/pr-number.txt ] || { echo "no comment to post"; exit 0; }
          pr=$(tr -d '[:space:]' < artifact/pr-number.txt)
          [[ "$pr" =~ ^[0-9]{1,9}$ ]] || { echo "bad PR number"; exit 1; }
          [ "$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)" = "$HEAD_SHA" ] || { echo "PR $pr is not at $HEAD_SHA"; exit 0; }
          marker='<!-- donut-permissions -->'
          head -c 60000 artifact/comment.md > body.md
          grep -qF "$marker" body.md || { echo "the comment has no marker"; exit 1; }
          id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
          fi
